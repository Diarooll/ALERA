<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Acesse sua conta ou crie uma nova para continuar." />
    <title>Entrar | A.L.E.R.A</title>
    <link rel="stylesheet" href="../css/login.css" />
  </head>

  <body>
    <svg xmlns="http://www.w3.org/2000/svg" hidden aria-hidden="true">
      <symbol id="i-logo" viewBox="-21 -7 108 102">
        <path
          d="M26 -4h8v8h-8zM26 6h8v8h-8zM16 16h8v8h-8zM26 16h8v8h-8zM36 16h8v8h-8zM16 26h8v8h-8zM36 26h8v8h-8zM6 36h8v8h-8zM16 36h8v8h-8zM36 36h8v8h-8zM46 36h8v8h-8zM6 46h8v8h-8zM16 46h8v8h-8zM36 46h8v8h-8zM46 46h8v8h-8zM-4 56h8v8h-8zM6 56h8v8h-8zM16 56h8v8h-8zM36 56h8v8h-8zM46 56h8v8h-8zM56 56h8v8h-8zM-4 66h8v8h-8zM6 66h8v8h-8zM16 66h8v8h-8zM26 66h8v8h-8zM36 66h8v8h-8zM46 66h8v8h-8zM56 66h8v8h-8zM6 76h8v8h-8zM16 76h8v8h-8zM36 76h8v8h-8zM46 76h8v8h-8zM16 86h8v8h-8zM26 86h8v8h-8zM36 86h8v8h-8z"
        />
        <path d="M-8 2h6v6h-6zM74 -6h6v6h-6zM70 16h6v6h-6zM-20 44h6v6h-6zM80 58h6v6h-6z" />
      </symbol>
      <symbol id="i-mail" viewBox="0 0 24 24">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="5" width="18" height="14" rx="3" />
          <path d="m4 7.5 8 6 8-6" />
        </g>
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="4.5" y="10.5" width="15" height="10" rx="3" />
          <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" />
        </g>
      </symbol>
      <symbol id="i-phone" viewBox="0 0 24 24">
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"
        />
      </symbol>
      <symbol id="i-pin" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z" />
          <circle cx="12" cy="10" r="2.5" />
        </g>
      </symbol>
      <symbol id="i-eye" viewBox="0 0 24 24">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
          <circle cx="12" cy="12" r="3" />
        </g>
      </symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
          <circle cx="12" cy="12" r="3" />
          <path d="M4 20 20 4" />
        </g>
      </symbol>
    </svg>

    <main class="page">
      <section class="card">
        <a href="#login" class="logo" aria-label="A.L.E.R.A - Entrar">
          <svg class="logo-symbol" aria-hidden="true"><use href="#i-logo"></use></svg>
          <span class="logo-text" aria-hidden="true">A.L.E.R.A</span>
        </a>

        <!-- LOGIN -->
        <div class="view" id="view-login" data-titulo="Entrar | A.L.E.R.A">
          <header class="head">
            <h1 tabindex="-1">Bem-vindo de volta!</h1>
            <p>Não tem uma conta? <a href="#cadastro">Criar conta</a></p>
          </header>

          <form class="form" data-form="login" novalidate>
            <div class="field">
              <label for="login-email">E-mail</label>
              <div class="control">
                <svg class="icon" aria-hidden="true"><use href="#i-mail"></use></svg>
                <input
                  type="email"
                  id="login-email"
                  placeholder="voce@exemplo.com"
                  autocomplete="username"
                  inputmode="email"
                  aria-describedby="login-email-error"
                />
              </div>
              <p class="error" id="login-email-error" hidden></p>
            </div>

            <div class="field">
              <label for="login-password">Senha</label>
              <div class="control">
                <svg class="icon" aria-hidden="true"><use href="#i-lock"></use></svg>
                <input
                  type="password"
                  id="login-password"
                  placeholder="Digite sua senha"
                  autocomplete="current-password"
                  aria-describedby="login-password-error"
                />
                <button
                  type="button"
                  class="toggle"
                  aria-label="Mostrar senha"
                  aria-pressed="false"
                >
                  <svg class="eye-off" aria-hidden="true"><use href="#i-eye-off"></use></svg>
                  <svg class="eye-on" aria-hidden="true"><use href="#i-eye"></use></svg>
                </button>
              </div>
              <p class="error" id="login-password-error" hidden></p>
            </div>

            <button type="submit" class="btn"><span class="btn-label">Entrar</span></button>

            <p class="forgot">Esqueceu sua senha? <a href="#">Recuperar</a></p>
          </form>
        </div>

        <!-- CADASTRO -->
        <div class="view" id="view-cadastro" data-titulo="Criar conta | A.L.E.R.A" hidden>
          <header class="head">
            <h1 tabindex="-1">Crie sua conta</h1>
            <p>Já tem uma conta? <a href="#login">Entrar</a></p>
          </header>

          <form class="form" data-form="cadastro" novalidate>
            <div class="field">
              <label for="cadastro-email">E-mail</label>
              <div class="control">
                <svg class="icon" aria-hidden="true"><use href="#i-mail"></use></svg>
                <input
                  type="email"
                  id="cadastro-email"
                  placeholder="voce@exemplo.com"
                  autocomplete="email"
                  inputmode="email"
                  aria-describedby="cadastro-email-error"
                />
              </div>
              <p class="error" id="cadastro-email-error" hidden></p>
            </div>

            <div class="field">
              <label for="cadastro-password">Senha</label>
              <div class="control">
                <svg class="icon" aria-hidden="true"><use href="#i-lock"></use></svg>
                <input
                  type="password"
                  id="cadastro-password"
                  placeholder="Crie uma senha"
                  autocomplete="new-password"
                  aria-describedby="cadastro-password-hint cadastro-password-error"
                />
                <button
                  type="button"
                  class="toggle"
                  aria-label="Mostrar senha"
                  aria-pressed="false"
                >
                  <svg class="eye-off" aria-hidden="true"><use href="#i-eye-off"></use></svg>
                  <svg class="eye-on" aria-hidden="true"><use href="#i-eye"></use></svg>
                </button>
              </div>
              <p class="hint" id="cadastro-password-hint">Use no mínimo 8 caracteres.</p>
              <p class="error" id="cadastro-password-error" hidden></p>
            </div>

            <div class="field">
              <label for="cadastro-phone">Telefone</label>
              <div class="control">
                <svg class="icon" aria-hidden="true"><use href="#i-phone"></use></svg>
                <input
                  type="tel"
                  id="cadastro-phone"
                  placeholder="(32) 99999-0000"
                  autocomplete="tel"
                  aria-describedby="cadastro-phone-hint cadastro-phone-error"
                />
              </div>
              <p class="hint" id="cadastro-phone-hint">
                Informe o DDD e o número. Exemplo: (32) 99999-0000
              </p>
              <p class="error" id="cadastro-phone-error" hidden></p>
            </div>

            <div class="field">
              <label for="cadastro-address">Endereço</label>
              <div class="control">
                <svg class="icon" aria-hidden="true"><use href="#i-pin"></use></svg>
                <input
                  type="text"
                  id="cadastro-address"
                  placeholder="Rua, número, bairro e cidade"
                  autocomplete="street-address"
                  aria-describedby="cadastro-address-error"
                />
              </div>
              <p class="error" id="cadastro-address-error" hidden></p>
            </div>

            <button type="submit" class="btn"><span class="btn-label">Criar conta</span></button>
          </form>
        </div>
      </section>
    </main>

    <script src="../js/login.js"></script>
  </body>
</html>
